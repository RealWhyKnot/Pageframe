[package]
name = "wpt"
version.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
edition = "2024"
license.workspace = true

[features]
default = ["cpu"]
gpu = ["dep:anyrender_vello"]
cpu = ["dep:anyrender_vello_cpu"]

[dependencies]
mimalloc = "0.1.48"
pageframe-dom = { workspace = true, features = ["svg", "floats", "system-fonts", "woff", "complex-scripts", "text-transform-icu", "writing-mode"] }
pageframe-html = {workspace = true }
pageframe-script = { workspace = true }
pageframe-traits = { workspace = true }
pageframe-paint = { workspace = true, features = ["default"] }
anyrender = { workspace = true }
anyrender_vello = { workspace = true, optional = true }
anyrender_vello_cpu = { workspace = true, optional = true }

taffy = { workspace = true }
style = { workspace = true }
style_traits = { workspace = true }
markup5ever = { workspace = true }
html5ever = { workspace = true }
roxmltree = "0.21"
parley = { workspace = true }
peniko = { workspace = true }
image = { workspace = true, features = ["png"] }
url = { workspace = true }
data-url = { workspace = true }
png = { version = "0.17" }
glob = { version = "0.3.1" }
html-escape = { workspace = true }
dify = { version = "0.7.4", default-features = false }
env_logger = { version = "0.11.5" }
tracing = { workspace = true, features = ["log"] }
owo-colors = "4.1.0"
regex = "1.11.1"
rayon = { workspace = true }
thread_local = { workspace = true }
bitflags = "2.6.0"
atomic_float = "1"
supports-hyperlinks = "3.1.0"
terminal-link = "0.1.0"
wptreport = { version = "0.0.5", default-features = false }
os_info = "3.10.0"
serde_json = "1.0.140"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unknown_lints = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
