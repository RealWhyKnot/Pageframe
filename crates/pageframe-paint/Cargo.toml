[package]
name = "pageframe-paint"
description = "Paint a Blitz Document using anyrender"
documentation = "https://docs.rs/pageframe-paint"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["svg"]
tracing = ["dep:tracing"]
svg = ["dep:anyrender_svg", "dep:usvg", "pageframe-dom/svg"]
custom-widget = ["pageframe-dom/custom-widget"]
font-embolden = []
apple-font-embolden = []
# Paint overlay scrollbar thumbs on scroll containers, and enable their
# drag/hover interaction in pageframe-dom (off by default while the feature
# matures).
scrollbars = ["pageframe-dom/scrollbars"]

[dependencies]
# Blitz dependencies
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true }
anyrender_svg = { workspace = true, optional = true }
pageframe-traits = { workspace = true }
pageframe-dom = { workspace = true }

# Servo dependencies
style = { workspace = true }
euclid = { workspace = true }

# DioxusLabs dependencies
taffy = { workspace = true }

# Linebender + WGPU dependencies
parley = { workspace = true, features = ["bytemuck"] }
skrifa = { workspace = true }
color = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }
usvg = { workspace = true, optional = true }

# Other dependencies
bytemuck = { workspace = true }
num-traits = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true, optional = true }
