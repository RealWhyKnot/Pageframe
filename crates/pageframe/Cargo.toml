[package]
name = "pageframe"
description = "Build native Rust apps with HTML and CSS"
version = "0.0.0"
license.workspace = true
edition = "2024"
rust-version = "1.99"
publish = false

[features]
default = ["gpu", "svg", "accessibility"]
gpu = ["dep:anyrender_vello"]
software = ["dep:anyrender_vello_cpu"]
svg = ["pageframe-dom/svg", "pageframe-paint/svg"]
accessibility = ["pageframe-dom/accessibility", "pageframe-shell/accessibility"]

[dependencies]
anyrender = { workspace = true }
anyrender_vello = { workspace = true, optional = true }
anyrender_vello_cpu = { workspace = true, optional = true, features = ["softbuffer_window_renderer"] }
pageframe-dom = { workspace = true, features = [
    "woff",
    "system-fonts",
    "file-input",
    "custom-widget",
    "text-transform-icu",
    "floats",
    "writing-mode",
] }
pageframe-html = { workspace = true }
pageframe-paint = { workspace = true, features = ["custom-widget"] }
pageframe-shell = { workspace = true }
pageframe-traits = { workspace = true }
pageframe-script = { workspace = true }
raw-window-handle = { workspace = true }
cursor-icon = { workspace = true }
serde_json = { workspace = true }
data-url = { workspace = true }
keyboard-types = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
kurbo = { workspace = true }
num-traits = { workspace = true }
parley = { workspace = true, features = ["bytemuck"] }
peniko = { workspace = true }
skrifa = { workspace = true }
selectors = { workspace = true }
style = { workspace = true }
style_dom = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
winit = { workspace = true }

[dev-dependencies]
anyrender_vello_cpu = { workspace = true }
pageframe-test-harness = { workspace = true }
pollster = { workspace = true }

[[example]]
name = "counter"
required-features = ["gpu"]

[[example]]
name = "todo"
required-features = ["gpu"]

[lints]
workspace = true
