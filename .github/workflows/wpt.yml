name: WPT

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTDOCFLAGS: "-D warnings"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"
  WPT_DIR: "./wpt/tests"

permissions:
  contents: read

jobs:
  wpt:
    name: "Run WPT Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          toolchain: stable
          cache: 'false'
      - uses: Swatinem/rust-cache@v2
        with:
          key: "blitz-wpt-linux"
          cache-all-crates: "true"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # fonts-tlwg-loma-otf provides a Thai font; some WPT reftests (e.g.
      # css/css-text/i18n/css3-text-line-break-opclns-201.html) depend on Thai glyphs
      # rendering at a realistic width rather than as a narrow .notdef box.
      - name: Install Fontconfig and fonts
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev fonts-tlwg-loma-otf
      - name: Clone WPT tests
        run: git clone --depth 1 --revision "$(cat ./wpt/WPT_COMMIT)" https://github.com/web-platform-tests/wpt ./wpt/tests
      - name: Build WPT runner
        run: cargo build -rp wpt
      - name: Run WPT tests
        run: cargo run -rp wpt css svg
      - name: Compress report (zstd)
        run: zstd -22 --ultra -o ./wpt/output/wptreport.json.zst ./wpt/output/wptreport.json
      - uses: actions/upload-artifact@v7
        with:
          name: wpt-report.json.zst
          path: ./wpt/output/wptreport.json.zst
          archive: false # Disables zipping. We are already using zstd compression
      - name: Copy files for Github pages
        run: |
          mkdir -p ./sites/gh-pages
          cp ./wpt/output/wptreport.json ./sites/gh-pages/wptreport.json
          cp ./wpt/output/wptreport.json.zst ./sites/gh-pages/wptreport.json.zst
      - name: Install wpt cli
        run: cargo install wpt@0.0.14
      - name: Generate scores.json
        run: |
          wpt calc-scores --in ./sites/gh-pages/wptreport.json --out ./sites/gh-pages/wptscores.json
          zstd -22 --long --ultra -o ./sites/gh-pages/wptscores.json.zst ./sites/gh-pages/wptscores.json
      - name: Fetch main-branch results
        run: curl https://dioxuslabs.github.io/blitz/wptreport.json -o ./wpt/output/main-wptreport.json
      - name: Diff WPT results
        run: |
          wpt diff ./wpt/output/main-wptreport.json ./wpt/output/wptreport.json | tee ./wpt/output/wptdiff.txt
          wpt diff --verbose --format json ./wpt/output/main-wptreport.json ./wpt/output/wptreport.json > ./wpt/output/wptdiff.json
          python3 ./.github/scripts/wpt_area_changes.py ./wpt/output/main-wptreport.json ./wpt/output/wptreport.json > ./wpt/output/wptareas.json
      - name: Render results in step summary
        if: github.event_name == 'pull_request'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 ./.github/scripts/wpt_diff_to_pr.py --dry-run --areas ./wpt/output/wptareas.json ./wpt/output/wptdiff.json
      - name: Upload WPT diff
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: wpt-diff
          path: |
            ./wpt/output/wptdiff.txt
            ./wpt/output/wptdiff.json
            ./wpt/output/wptareas.json
