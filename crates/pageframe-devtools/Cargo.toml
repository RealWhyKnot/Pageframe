[package]
name = "pageframe-devtools"
description = "Chrome DevTools Protocol server implementation"
version.workspace = true
license.workspace = true
categories.workspace = true
edition.workspace = true

[features]
default = ["embedded-frontend"]
# Embed a DevTools frontend (about 2 MB) and serve it, so that `frontend_url`
# is a local URL any Chromium-based browser can open. Without it, `frontend_url`
# is a `devtools://` URL that has to be pasted into Chrome.
embedded-frontend = ["dep:blitz-chrome-devtools-frontend"]

[dependencies]
# Pageframe dependencies
pageframe-traits = { workspace = true }
pageframe-dom = { workspace = true, features = ["devtools"] }
blitz-chrome-devtools-frontend = { workspace = true, optional = true }

# Style / layout dependencies
style = { workspace = true }
cssparser = { workspace = true }

# Networking dependencies
serde = { workspace = true }
serde_json = { workspace = true }
tungstenite = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
pageframe-html = { workspace = true }
# Text must be laid out with real fonts for inline fragment geometry to be non-zero
pageframe-dom = { workspace = true, features = ["system-fonts"] }
tungstenite = { workspace = true }
