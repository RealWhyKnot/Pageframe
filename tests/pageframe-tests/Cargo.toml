[package]
name = "pageframe-tests"
version.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Integration tests for Pageframe"
license.workspace = true
categories.workspace = true
edition.workspace = true
autotests = false

[dev-dependencies]
# Pageframe dependencies
pageframe-test-harness = { workspace = true }
pageframe-dom = { workspace = true, features = ["accessibility", "autofocus", "custom-widget", "floats", "system-fonts", "text-transform-icu"] }
pageframe-html = { workspace = true }
pageframe-traits = { workspace = true }
pageframe-paint = { workspace = true, features = ["scrollbars", "svg"] }
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true }

# Other dependencies
style = { workspace = true }
accesskit = { workspace = true }
markup5ever = { workspace = true }
cursor-icon = { workspace = true }
keyboard-types = { workspace = true }
taffy = { workspace = true }
test-that = { workspace = true }
usvg = { workspace = true }

[lib]
path = "lib.rs"

[[test]]
name = "all"
path = "tests/all.rs"

[lints.rust]
unknown_lints = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
