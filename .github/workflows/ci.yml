name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'LICENSE-*'
      - 'NOTICE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'LICENSE-*'
      - 'NOTICE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
    uses: RealWhyKnot/workflows/.github/workflows/repo-checks.yml@v1

  gate:
    name: Push gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install lint packages
        run: npm ci

      - name: Set up Rust
        uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          components: rustfmt, clippy
          cache-key: cargo-gate

      - name: Set up PSScriptAnalyzer
        uses: RealWhyKnot/workflows/setup-pssa@v1

      - name: Set up shell tools
        uses: RealWhyKnot/workflows/setup-shell-tools@v1

      - name: Set up lint tools
        uses: RealWhyKnot/workflows/setup-lint-tools@v1

      - name: Run the push gate
        run: bash .githooks/pre-push

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          components: clippy
          cache-key: cargo-test-${{ matrix.os }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

  features:
    name: Feature builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Set up Rust
        uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          components: clippy
          cache-key: cargo-features

      - name: Pageframe without default features
        run: cargo check -p pageframe --no-default-features --locked

      - name: DOM feature set
        run: >-
          cargo clippy -p pageframe-dom --no-default-features --locked --all-targets
          --features svg,woff,accessibility,system-fonts,file-input,custom-widget,parallel-construct
          -- -D warnings

  msrv:
    name: Minimum Rust version (1.99)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Set up Rust
        uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          toolchain: '1.99'
          cache-key: cargo-msrv

      - name: Build
        run: cargo build --workspace --locked
