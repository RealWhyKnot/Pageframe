name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - v0.*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTDOCFLAGS: "-D warnings"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"

permissions:
  contents: read

jobs:

  checks:
    permissions:
      contents: read
    uses: RealWhyKnot/workflows/.github/workflows/repo-checks.yml@v1

  style:
    name: Pageframe style and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install check dependencies
        shell: bash
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt libfontconfig1-dev
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: RealWhyKnot/workflows/setup-pssa@v1
      - uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
          cache-key: cargo-style
      - name: Check style and tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          bash .githooks/pre-push

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: stable
          arguments: --workspace --all-features --locked
          command-arguments: licenses

  # MSRV check.
  # Blitz only guarantees "latest stable". However we have this check here to ensure that we advertise
  # our MSRV. We also make an effort not to increase MSRV in patch versions of Blitz.
  #
  # We only run `cargo build` (not `cargo test`) so as to avoid requiring dev-dependencies to build with the MSRV
  # version. Building is likely sufficient as runtime errors varying between rust versions is very unlikely.
  build-msrv:
    name: "MSRV Build [Rust 1.91]"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          toolchain: '1.91'
          cache-key: cargo-msrv
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo build --workspace --exclude pageframe

  build-features-default:
    name: "Build [default features]"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          toolchain: stable
          cache-key: cargo-default
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo build --workspace

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: 'false'
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      CLIPPY_CONF_DIR: ${{ github.workspace }}/../upstream-clippy
    steps:
      - uses: actions/checkout@v7
      - uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          toolchain: stable
          components: clippy
          cache-key: cargo-clippy
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: mkdir -p "$CLIPPY_CONF_DIR"
      - run: cargo clippy --workspace --exclude pageframe -- -D warnings
      - run: cargo clippy -p blitz-dom --no-default-features --features svg,woff,accessibility,system-fonts,file-input,custom-widget --all-targets -- -D warnings

  ci-scripts:
    name: "Test CI scripts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s .github/scripts

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          toolchain: stable
          cache-key: cargo-doc
      - run: cargo doc

  matrix_test:
    runs-on: ${{ matrix.platform.os }}
    env:
      RUST_CARGO_COMMAND: ${{ matrix.platform.cross == true && 'cross' || 'cargo' }}
      RUSTFLAGS: ${{ matrix.platform.name == 'ios' && '-Clink-arg=-target -Clink-arg=arm64-apple-ios18.4 -Clink-arg=-miphoneos-version-min=18.4' || '' }}  
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {
              name: windows,
              target: x86_64-pc-windows-msvc,
              os: windows-latest,
              cross: false,
              command: "test",
              args: "--all --tests",
            }
          - {
              name: macos,
              target: aarch64-apple-darwin,
              os: macos-latest,
              cross: false,
              command: "test",
              args: "--all --tests",
            }
          - {
              name: linux,
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-latest,
              cross: false,
              command: "test",
              args: "--workspace",
            }
          - {
              name: ios,
              target: aarch64-apple-ios,
              os: macos-latest,
              cross: false,
              command: "build",
              args: "--all",
            }
          - {
              name: android,
              target: aarch64-linux-android,
              os: ubuntu-latest,
              cross: true,
              command: "build",
              args: "--all",
            }

    name: Test (${{ matrix.platform.name }})

    steps:
      - uses: actions/checkout@v7
      - name: install stable
        uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}
          cache: 'false'

      # Install cross from source. Because latest release doesn't work with recent Rust
      # when targeting Android. See https://github.com/cross-rs/cross/issues/1222
      - name: Install cross
        if: ${{ matrix.platform.cross == true }}
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 426e811

      # Disabled: not currently needed. Uncomment if Linux runners run out of disk space.
      # - name: Free Disk Space (Ubuntu)
      #   if: ${{ runner.os == 'Linux' }}
      #   uses: jlumbroso/free-disk-space@v1.3.1
      #   with: # speed things up a bit
      #     android: ${{ matrix.platform.target != 'aarch64-linux-android' }}
      #     large-packages: false
      #     swap-storage: false

      - uses: Swatinem/rust-cache@v2
        with:
          key: "${{ matrix.platform.target }}"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: ${{ matrix.platform.os != 'macos-latest' }} # works around https://github.com/Swatinem/rust-cache/issues/341

      - name: Install apt deps
        if: ${{ matrix.platform.os == 'ubuntu-latest' }}
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: test
        run: |
          ${{ env.RUST_CARGO_COMMAND }} ${{ matrix.platform.command }} ${{ matrix.platform.args }} --target ${{ matrix.platform.target }}
