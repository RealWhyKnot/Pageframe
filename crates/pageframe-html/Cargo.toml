[package]
name = "pageframe-html"
description = "Blitz HTML parser"
documentation = "https://docs.rs/pageframe-html"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
accessibility = ["pageframe-dom/accessibility"]
tracing = ["dep:tracing", "pageframe-dom/tracing"]

[dependencies]
# Blitz dependencies
pageframe-dom = { workspace = true }
pageframe-traits = { workspace = true }

# Servo dependencies
html5ever = { workspace = true }
xml5ever = { workspace = true }

tracing = { workspace = true, optional = true }
