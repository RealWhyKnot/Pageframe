[package]
name = "pageframe"
description = "Build native Rust apps with HTML and CSS"
version = "0.0.0"
license.workspace = true
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyrender = { workspace = true }
anyrender_vello = { workspace = true }
pageframe-dom = { workspace = true, features = ["default", "floats"] }
pageframe-html = { workspace = true }
pageframe-paint = { workspace = true, features = ["svg", "custom-widget"] }
pageframe-shell = { workspace = true, features = ["accessibility"] }
pageframe-traits = { workspace = true }
data-url = { workspace = true }
keyboard-types = { workspace = true }
bytemuck = { workspace = true }
kurbo = { workspace = true }
parley = { workspace = true, features = ["bytemuck"] }
peniko = { workspace = true }
selectors = { workspace = true }
style = { workspace = true }
style_dom = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
winit = { workspace = true }

[dev-dependencies]
anyrender_vello_cpu = { workspace = true }
pageframe-test-harness = { workspace = true }

[lints]
workspace = true
