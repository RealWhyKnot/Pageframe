name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (vX.Y.Z or vX.Y.Z-beta.YYYYMMDD.N)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        uses: RealWhyKnot/workflows/resolve-tag@v1
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          tag-pattern: '^v\d+\.\d+\.\d+(-beta\.\d{8}\.\d+)?$'
          prerelease-pattern: '-beta\.'

      - name: Check Cargo.toml matches the release
        if: steps.tag.outputs.prerelease != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $section = ''
          $cargo = ''
          foreach ($line in [System.IO.File]::ReadAllLines((Join-Path (Get-Location) 'Cargo.toml'))) {
            $trimmed = $line.Trim()
            if ($trimmed -match '^\[.*\]$') { $section = $trimmed; continue }
            if ($section -eq '[workspace.package]' -and $trimmed -match '^version\s*=\s*"([^"]*)"') {
              $cargo = $Matches[1]
              break
            }
          }
          if ($cargo -ne $env:VERSION) {
            throw "Cargo.toml [workspace.package] version is '$cargo' but the tag is v$($env:VERSION)."
          }
          Write-Host "Cargo.toml version $cargo matches the tag."

      - name: Wait for CI
        uses: RealWhyKnot/workflows/wait-for-ci@v1
        with:
          sha: ${{ steps.tag.outputs.sha }}
          workflow: ci.yml
          timeout-minutes: '60'

  test:
    name: Test ${{ needs.validate.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Set up Rust
        uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          cache-key: cargo-release

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Test the changelog scripts
        shell: pwsh
        run: ./.github/changelog/Test-UpdateChangelog.ps1

      - name: Test the nightly beta planner
        shell: pwsh
        run: ./.github/scripts/Test-GetNightlyBetaPlan.ps1

  publish:
    name: Publish ${{ needs.validate.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, test]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.validate.outputs.tag }}

      - name: Build release notes
        id: notes
        uses: RealWhyKnot/workflows/release-notes@v1
        with:
          tag: ${{ needs.validate.outputs.tag }}
          title: Pageframe ${{ needs.validate.outputs.tag }}

      - name: Publish
        uses: RealWhyKnot/workflows/publish-release@v1
        with:
          tag: ${{ needs.validate.outputs.tag }}
          title: Pageframe ${{ needs.validate.outputs.tag }}
          notes-file: ${{ steps.notes.outputs.file }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          draft-first: 'true'

  changelog:
    name: Promote the changelog for ${{ needs.validate.outputs.tag }}
    if: needs.validate.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, publish]
    permissions:
      contents: write
    concurrency:
      group: changelog-append
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Promote Unreleased
        shell: pwsh
        env:
          TAG_NAME: ${{ needs.validate.outputs.tag }}
        run: |
          $global:LASTEXITCODE = 0
          ./.github/changelog/Update-Changelog.ps1 -Mode Promote -Version $env:TAG_NAME -Through $env:TAG_NAME
          if ($LASTEXITCODE -ne 0) { throw "Update-Changelog failed ($LASTEXITCODE)" }

      - name: Commit the changelog
        uses: RealWhyKnot/workflows/commit-on-branch@v1
        with:
          paths: CHANGELOG.md
          headline: "docs(changelog): promote ${{ needs.validate.outputs.tag }} [skip changelog]"
          branch: main
