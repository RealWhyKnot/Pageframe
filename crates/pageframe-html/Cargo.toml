[package]
name = "pageframe-html"
description = "Pageframe HTML parser"
version.workspace = true
license.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
accessibility = ["pageframe-dom/accessibility"]
tracing = ["dep:tracing", "pageframe-dom/tracing"]

[dependencies]
# Pageframe dependencies
pageframe-dom = { workspace = true }
pageframe-traits = { workspace = true }

# Servo dependencies
html5ever = { workspace = true }
xml5ever = { workspace = true }

tracing = { workspace = true, optional = true }
