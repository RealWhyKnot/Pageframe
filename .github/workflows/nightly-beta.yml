name: Nightly beta

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    permissions:
      contents: write
      actions: read
    uses: RealWhyKnot/workflows/.github/workflows/nightly-beta-scripted.yml@v1
    with:
      planner: ./.github/scripts/Get-NightlyBetaPlan.ps1
      validate-scripts: ./.github/scripts/Test-GetNightlyBetaPlan.ps1
      dispatch-release: false
      ci-workflow: ci.yml
      ignore-paths: |
        wpt/**

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
