[package]
name = "pageframe-script"
version.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "JavaScript execution for Pageframe using the Boa engine"
license.workspace = true
categories.workspace = true
edition.workspace = true

[features]
default = []
tracing = ["pageframe-dom/tracing"]

[dependencies]
# Pageframe dependencies
pageframe-dom = { workspace = true, features = ["autofocus"] }
pageframe-html = { workspace = true }
pageframe-traits = { workspace = true }

# Boa (JavaScript engine)
# `annex-b` enables the Annex B (web-compatibility) ECMAScript features
# (String.prototype.substr, escape/unescape, HTML comments in scripts, ...)
# which all browsers implement and web content relies on
boa_engine = { workspace = true, features = ["annex-b"] }
boa_runtime = { workspace = true }
boa_gc = { workspace = true }

# Servo dependencies
markup5ever = { workspace = true }
style = { workspace = true }

# Other dependencies
icu_properties = { workspace = true }
keyboard-types = { workspace = true }
url = { workspace = true }
data-url = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
num-traits = { workspace = true }
web-time = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"

[dev-dependencies]
pageframe-traits = { workspace = true }
# system-fonts is needed so that text inputs shape real text in tests
# (the selection tests depend on cursor placement within a text layout)
pageframe-dom = { workspace = true, features = ["system-fonts", "text-transform-icu"] }
keyboard-types = { workspace = true }
url = { workspace = true }

[lints.rust]
unknown_lints = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
