name: WPT

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE-*'
      - 'NOTICE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE-*'
      - 'NOTICE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: wpt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WPT_DIR: ./wpt/tests

permissions:
  contents: read

jobs:
  wpt:
    name: Run WPT tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          cache: 'false'

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: pageframe-wpt-linux
          cache-all-crates: 'true'
          cache-workspace-crates: 'true'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Fontconfig and fonts
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev fonts-tlwg-loma-otf

      - name: Clone WPT tests
        run: git clone --depth 1 --revision "$(cat ./wpt/WPT_COMMIT)" https://github.com/web-platform-tests/wpt ./wpt/tests

      - name: Build WPT runner
        run: cargo build --locked -rp wpt

      - name: Run WPT tests
        run: cargo run --locked -rp wpt css svg

      - name: Compress report
        run: zstd -22 --ultra -o ./wpt/output/wptreport.json.zst ./wpt/output/wptreport.json

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wpt-report.json.zst
          path: ./wpt/output/wptreport.json.zst
          archive: false

      - name: Fetch the main-branch report
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_id="$(gh run list --repo "$REPO" --workflow wpt.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "No finished WPT run on main yet, so there is nothing to compare against."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ./wpt/output/main
          gh run download "$run_id" --repo "$REPO" --name wpt-report.json.zst --dir ./wpt/output/main
          zstd -d -o ./wpt/output/main-wptreport.json ./wpt/output/main/wptreport.json.zst
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Install wpt cli
        if: steps.baseline.outputs.found == 'true'
        run: cargo install --locked wpt@0.0.14

      - name: Diff WPT results
        if: steps.baseline.outputs.found == 'true'
        run: |
          wpt diff ./wpt/output/main-wptreport.json ./wpt/output/wptreport.json | tee ./wpt/output/wptdiff.txt
          wpt diff --verbose --format json ./wpt/output/main-wptreport.json ./wpt/output/wptreport.json > ./wpt/output/wptdiff.json
          python3 ./.github/scripts/wpt_area_changes.py ./wpt/output/main-wptreport.json ./wpt/output/wptreport.json > ./wpt/output/wptareas.json

      - name: Render results in step summary
        if: steps.baseline.outputs.found == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 ./.github/scripts/wpt_diff_to_pr.py --dry-run --areas ./wpt/output/wptareas.json ./wpt/output/wptdiff.json

      - name: Upload WPT diff
        if: steps.baseline.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wpt-diff
          path: |
            ./wpt/output/wptdiff.txt
            ./wpt/output/wptdiff.json
            ./wpt/output/wptareas.json
