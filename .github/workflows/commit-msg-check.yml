name: Commit message check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    uses: RealWhyKnot/workflows/.github/workflows/commit-msg-check.yml@v1
    with:
      check-conventional: true
      forbidden-body-pattern: '(^|[^A-Za-z0-9_])#[0-9]+|github\.com/DioxusLabs'
