[package]
name = "anyrender_vello_cpu"
description = "vello_cpu backend for anyrender"
version = "0.18.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dioxuslabs/anyrender"
edition = "2024"
publish = false

[features]
pixels_window_renderer = ["dep:pixels_window_renderer"]
softbuffer_window_renderer = ["dep:softbuffer_window_renderer"]
multithreading = ["vello_cpu/multithreading"]
log_frame_times = [
  "debug_timer/enable",
  "softbuffer_window_renderer?/log_frame_times",
  "pixels_window_renderer?/log_frame_times",
]
filters = []

[dependencies]
anyrender = { git = "https://github.com/DioxusLabs/anyrender", rev = "812644a68722626e6755ca8319ffebf53c9cdc4e" }
anyrender_directwrite = { path = "../../crates/anyrender_directwrite" }
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
color = { version = "0.3", features = ["bytemuck"] }
debug_timer = { path = "../../crates/debug_timer" }
kurbo = "0.13.1"
peniko = "0.6"
glifo = { version = "0.4" }
softbuffer_window_renderer = { git = "https://github.com/DioxusLabs/anyrender", rev = "812644a68722626e6755ca8319ffebf53c9cdc4e", optional = true }
pixels_window_renderer = { git = "https://github.com/DioxusLabs/anyrender", rev = "812644a68722626e6755ca8319ffebf53c9cdc4e", optional = true }
vello_cpu = { version = "0.3", default-features = false, features = ["std", "text", "u8_pipeline"] }
vello_common = { version = "0.3" }
