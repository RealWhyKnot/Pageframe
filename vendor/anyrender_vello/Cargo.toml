[package]
name = "anyrender_vello"
description = "Vello backend for anyrender"
version = "0.15.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dioxuslabs/anyrender"
edition = "2024"
publish = false

[features]
log_frame_times = ["debug_timer/enable"]

[dependencies]
anyrender = { git = "https://github.com/DioxusLabs/anyrender", rev = "812644a68722626e6755ca8319ffebf53c9cdc4e" }
wgpu_context = { git = "https://github.com/DioxusLabs/anyrender", rev = "812644a68722626e6755ca8319ffebf53c9cdc4e" }
debug_timer = { path = "../../crates/debug_timer" }
kurbo = "0.13.1"
peniko = "0.6"
vello = { version = "0.11", features = ["wgpu"] }
wgpu = "30"
rustc-hash = "2"
futures-channel = "0.3"
tracing = "0.1"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
anyrender_directwrite = { path = "../../crates/anyrender_directwrite" }
