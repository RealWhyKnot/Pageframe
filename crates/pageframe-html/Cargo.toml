[package]
name = "pageframe-html"
version.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Pageframe HTML parser"
license.workspace = true
categories.workspace = true
edition.workspace = true

[features]
accessibility = ["pageframe-dom/accessibility"]
tracing = ["dep:tracing", "pageframe-dom/tracing"]

[dependencies]
# Pageframe dependencies
pageframe-dom = { workspace = true }
pageframe-traits = { workspace = true }

# Servo dependencies
html5ever = { workspace = true }
xml5ever = { workspace = true }

tracing = { workspace = true, optional = true }

[lints.rust]
unknown_lints = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
