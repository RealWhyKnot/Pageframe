[package]
name = "pageframe-test-harness"
version.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Headless test harness for Pageframe documents"
license.workspace = true
categories.workspace = true
edition.workspace = true

[dependencies]
# Pageframe dependencies
pageframe-dom = { workspace = true, features = ["accessibility", "system-fonts"] }
pageframe-html = { workspace = true }
pageframe-traits = { workspace = true }

# Other dependencies
keyboard-types = { workspace = true }
smol_str = { workspace = true }

[lints.rust]
unknown_lints = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
