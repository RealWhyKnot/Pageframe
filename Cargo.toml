[workspace]
members = [
    "crates/accesskit_xplat",
    "crates/debug_timer",
    "crates/pageframe-traits",
    "crates/pageframe-dom",
    "crates/pageframe-html",
    "crates/pageframe-paint",
    "crates/pageframe-script",
    "crates/pageframe-shell",
    "crates/pageframe-devtools",
    "crates/stylo_taffy",
    "crates/pageframe-test-harness",
    "crates/pageframe",
    "wpt/runner",
    "tests/pageframe-tests",
]
default-members = ["crates/pageframe"]
exclude = ["sites", "vendor"]
resolver = "2"

[workspace.package]
version = "0.3.0-beta.4"
license = "MIT OR Apache-2.0"
categories = ["gui"]
edition = "2024"
rust-version = "1.91.0"

[workspace.dependencies]
# In-repo crates
pageframe-dom = { version = "=0.3.0-beta.4", path = "./crates/pageframe-dom", default-features = false }
pageframe-html = { version = "=0.3.0-beta.4", path = "./crates/pageframe-html", default-features = false }
pageframe-paint = { version = "=0.3.0-beta.4", path = "./crates/pageframe-paint", default-features = false }
pageframe-script = { version = "=0.3.0-beta.4", path = "./crates/pageframe-script", default-features = false }
pageframe-shell = { version = "=0.3.0-beta.4", path = "./crates/pageframe-shell", default-features = false }
pageframe-devtools = { version = "=0.3.0-beta.4", path = "./crates/pageframe-devtools", default-features = false }
pageframe-traits = { version = "=0.3.0-beta.4", path = "./crates/pageframe-traits", default-features = false }
stylo_taffy = { version = "=0.3.0-beta.4", path = "./crates/stylo_taffy", default-features = false }
debug_timer = { version = "0.1.2", path = "./crates/debug_timer" }
accesskit_xplat = { version = "0.2", path = "./crates/accesskit_xplat", default-features = false }
pageframe-test-harness = { path = "./crates/pageframe-test-harness" }
thiserror = "2"

# Servo dependencies
style = { version = "0.23.0", path = "./vendor/stylo/style", package = "stylo" }
style_traits = { version = "0.23.0", path = "./vendor/stylo/style_traits", package = "stylo_traits" }
style_atoms = { version = "0.23.0", path = "./vendor/stylo/stylo_atoms", package = "stylo_atoms" }
style_config = { version = "0.23.0", path = "./vendor/stylo/stylo_static_prefs", package = "stylo_static_prefs" }
style_dom = { version = "0.23.0", path = "./vendor/stylo/stylo_dom", package = "stylo_dom" }
selectors = { version = "0.42.0", path = "./vendor/stylo/selectors", package = "selectors" }
cssparser = { version = "0.38.0" }

# HTML5ever dependencies
markup5ever = "0.40.0" # needs to match stylo web_atoms version
html5ever = "0.40.1"   # needs to match stylo web_atoms version
xml5ever = "0.40.0"    # needs to match stylo web_atoms version

# Other Servo dependencies
euclid = "0.22"
atomic_refcell = "0.1.13"
app_units = "0.7.5"
smallvec = "1"
thin-vec = "0.2"

# Taffy + Parley + Fontations
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "4aca4f4933aa9cb7a3266050c788aad4c90288d2", default-features = false, features = [
    "std",
    "flexbox",
    "flexbox_balance",
    "grid",
    "block_layout",
    "content_size",
    "calc",
    "detailed_layout_info",
] }
parley = { version = "0.12", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = [
    "std",
] } # Should match parley and vello versions

# AnyRender
anyrender = { git = "https://github.com/DioxusLabs/anyrender", branch = "main" }
anyrender_vello = { git = "https://github.com/DioxusLabs/anyrender", branch = "main" }
anyrender_vello_cpu = { git = "https://github.com/DioxusLabs/anyrender", branch = "main" }
anyrender_svg = { git = "https://github.com/DioxusLabs/anyrender", branch = "main" }

# Linebender + Fontations + WGPU + SVG
color = "0.3"
linebender_resource_handle = "0.1"
peniko = "0.6.0"
kurbo = "0.13.1"
usvg = "0.48.1"
svgtypes = "0.16.1" # Should match usvg's version

# Windowing & Input
raw-window-handle = "0.6.0"
winit = { version = "=0.31.0-beta.4" }
accesskit = "0.25"
rfd = { version = "0.17.1", default-features = false }
keyboard-types = "0.8"
cursor-icon = "1"

# IO & Networking
url = "2.5.0"
http = "1.1.0"
data-url = "0.3.1"
tokio = "1.42"

# Media & Decoding
image = { version = "0.25.6", default-features = false }
wuff = "0.2"
html-escape = "0.2.13"
percent-encoding = "2.3.1"
png = "0.18"
serde = "1"
serde_json = "1"
tungstenite = "0.30"
blitz-chrome-devtools-frontend = "0.1"

# Dioxus Native
webbrowser = "1.0"

# WASM
wasm-bindgen = "0.2"
web-sys = "0.3.98"
web-time = "1"

# JavaScript engine (Boa)
boa_engine = "0.22"
boa_runtime = "0.22"
boa_gc = "0.22"

# Other dependencies
bytes = "1.7.1"
slotmap = "1.0.7"
tracing = "0.1.40"
futures-util = "0.3.30"
pollster = "0.4"
smol_str = "0.3"
bitflags = "2.8.0"
bytemuck = "1"
num-traits = "0.2.19"
rayon = "1"
test-that = "0.6.0"
thread_local = "1"

# Unicode (ICU4X)
icu_casemap = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "2.3", default-features = false }
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
writeable = { version = "0.6", default-features = false }

[workspace.lints.rust]
unknown_lints = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
self_named_module_files = "deny"
ref_option = "deny"
needless_pass_by_value = "deny"
fn_params_excessive_bools = "deny"
clone_on_ref_ptr = "deny"
redundant_clone = "deny"
match_wildcard_for_single_variants = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
cast_precision_loss = "deny"
as_conversions = "deny"
map_err_ignore = "deny"
format_push_string = "deny"
needless_collect = "deny"
significant_drop_tightening = "deny"
manual_assert_eq = "deny"
assert_is_empty = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.profile]
inherits = "release"
debug = true

[profile.production]
inherits = "release"
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[profile.p2]
inherits = "production"
opt-level = 2

[profile.small]
inherits = "production"
opt-level = "s"
panic = "abort"

[profile.small-panic]
inherits = "small"
panic = "unwind"

[profile.tiny]
inherits = "small"
opt-level = "z"

[profile.tiny.package.fearless_simd]
opt-level = 3
[profile.tiny.package.vello_cpu]
opt-level = 3
[profile.tiny.package.taffy]
opt-level = 3
[profile.tiny.package.harfrust]
opt-level = 3
[profile.tiny.package.skrifa]
opt-level = 3

# This is a "virtual package"
# It is not meant to be published, but is used so "cargo run --example XYZ" works properly
# glifo 0.4.0 with the unhinted embolden fix (linebender/vello#2049). Drop once it ships.
[patch.crates-io]
glifo = { git = "https://github.com/DioxusLabs/vello", branch = "devin/glifo-0.4.0-embolden-2049" }
vello_common = { git = "https://github.com/DioxusLabs/vello", branch = "devin/glifo-0.4.0-embolden-2049" }
vello_cpu = { git = "https://github.com/DioxusLabs/vello", branch = "devin/glifo-0.4.0-embolden-2049" }
vello_gpu = { git = "https://github.com/DioxusLabs/vello", branch = "devin/glifo-0.4.0-embolden-2049" }
parley_engine = { path = "./vendor/parley_engine" }
parley = { path = "./vendor/parley" }

[patch."https://github.com/DioxusLabs/anyrender"]
anyrender_vello_cpu = { path = "./vendor/anyrender_vello_cpu" }

